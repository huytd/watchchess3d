<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2e5de">
<title>Shadowboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#e2e5de; --panel:#f3f4f0; --ink:#1b241f; --muted:#5b665e; --line:#c9cfc6;
  --accent:#8a6a24; --accent-ink:#ffffff; --stage:#151b17; --stage-ink:#e3e9e1; --danger:#a33a2a;
  --shadow:0 10px 30px rgba(20,28,24,0.18), 0 2px 6px rgba(20,28,24,0.12);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e2722; --panel:#232d27; --ink:#e8e7dd; --muted:#9aa69c; --line:#38463e;
    --accent:#cfa95f; --accent-ink:#1a221d; --stage:#0e1310; --danger:#e48a73;
    --shadow:0 10px 30px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1e2722; --panel:#232d27; --ink:#e8e7dd; --muted:#9aa69c; --line:#38463e;
  --accent:#cfa95f; --accent-ink:#1a221d; --stage:#0e1310; --danger:#e48a73;
  --shadow:0 10px 30px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%; margin:0; overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14px; line-height:1.4;
}
img,video,canvas{max-width:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* the board fills the page */
.scene{position:fixed; inset:0; background:var(--bg)}
.scene canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
.scene canvas:active{cursor:grabbing}

/* floating video card, bottom left */
.card{
  position:fixed; z-index:2;
  left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:clamp(300px, 30vw, 620px);
  background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; transition:width .25s ease;
}
.card.expanded{width:min(62vw, 1100px)}
.card.cropped{width:clamp(360px, 24vw, 460px)}
.stage{
  position:relative; aspect-ratio:16/9; background:var(--stage); overflow:hidden;
  border-radius:15px 15px 0 0;
}
.card.cropped .stage{aspect-ratio:var(--ar, 1)}
.stage video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
.card.cropped .stage video{inset:auto; object-fit:fill}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.stage.drawing canvas{pointer-events:auto; cursor:crosshair; touch-action:none}
.empty{
  position:absolute; inset:0; color:var(--stage-ink); padding:16px 18px;
  display:flex; flex-direction:column; justify-content:center; gap:10px; overflow:auto;
}
.empty .lead{margin:0; font-size:17px; font-weight:600}
.empty .small{margin:0; color:#aab5ac; font-size:13px}
.empty input{
  flex:1 1 140px; min-width:0; font:inherit; color:var(--stage-ink); background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18); border-radius:999px; padding:7px 12px;
}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{
  font:inherit; font-weight:600; font-size:13px; padding:7px 12px; border-radius:999px;
  border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.empty .btn{color:var(--stage-ink); border-color:rgba(255,255,255,0.25)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn[aria-pressed="true"]{background:color-mix(in srgb, var(--accent) 18%, transparent); border-color:var(--accent)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.icon{padding:7px 10px; font-size:15px; line-height:1}
#trackBtn.on{background:transparent; color:var(--ink); border-color:var(--accent)}
#trackBtn.on::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--accent)}
.bar{display:flex; align-items:center; gap:6px; padding:8px 8px 4px; min-width:0; flex-wrap:wrap}
.bar .spacer{flex:1}
.hint{margin:0; padding:0 14px 9px; color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hint.warn{color:var(--danger)}

/* the ⋯ menu */
.menu{
  position:absolute; right:8px; bottom:72px; z-index:3;
  width:250px; max-height:min(70vh, 520px); overflow:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  padding:6px; display:flex; flex-direction:column;
}
.menu button, .menu a{
  font:inherit; text-align:left; background:none; border:0; color:var(--ink); padding:8px 10px;
  border-radius:8px; cursor:pointer; text-decoration:none;
}
.menu button:hover, .menu a:hover{background:color-mix(in srgb, var(--ink) 7%, transparent)}
.menu button[aria-pressed="true"]::after{content:" \2713"; color:var(--accent)}
.menu label{display:flex; flex-direction:column; gap:4px; padding:6px 10px; color:var(--muted); font-size:12.5px}
.menu select{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px}
.menu hr{border:0; border-top:1px solid var(--line); margin:4px 6px}

@media (max-width:700px){
  .card, .card.cropped, .card.expanded{left:10px; right:10px; width:auto}
  .card.cropped{width:min(86vw, 340px); right:auto}
}

/* server version additions */
.stage #yt, .stage iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.card.cropped .stage #yt, .card.cropped .stage iframe, .card.cropped .stage video{inset:auto}
.stage .still{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
.progress{height:3px; background:transparent}
.progress span{display:block; height:100%; width:0; background:var(--accent); transition:width .4s ease}
.empty form{display:flex; gap:8px; flex-wrap:wrap}
.empty .or{display:flex; align-items:center; gap:8px; color:#aab5ac; font-size:13px}
.empty .err{color:#f0a08c; margin:0; font-size:13px}
</style>
</head>
<body>
<div class="scene" id="scene" aria-label="3D chess board. Drag to rotate, pinch or scroll to zoom."></div>

<aside class="card" id="card" aria-label="Video">
  <div class="stage" id="stage">
    <div id="yt"></div>
    <video id="video" playsinline controls hidden></video>
    <canvas class="still" id="still" hidden></canvas>
    <canvas id="overlay"></canvas>
    <div class="empty" id="empty">
      <p class="lead">Follow a chess video in 3D</p>
      <form id="urlForm">
        <input type="url" id="ytUrl" placeholder="Paste a YouTube link" aria-label="YouTube link" required>
        <button class="btn primary" style="color:var(--accent-ink)">Load</button>
      </form>
      <div class="or">or <button class="btn" id="fileBtn" type="button">upload a video file</button></div>
      <p class="err" id="emptyErr" hidden></p>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
  <div class="bar">
    <button class="btn" id="cropBtn" aria-pressed="false" disabled title="Show only the board area of the video">Crop</button>
    <button class="btn" id="fixBtn" aria-pressed="false" disabled title="Draw the board area yourself">Fix board area</button>
    <span class="spacer"></span>
    <button class="btn icon" id="moreBtn" aria-expanded="false" aria-controls="menu" aria-label="More options">&#8943;</button>
  </div>
  <p class="hint" id="hint" role="status" aria-live="polite">Paste a YouTube link to start.</p>
  <div class="menu" id="menu" hidden>
    <button id="newBtn">Another video</button>
    <hr>
    <label>Orientation in the video
      <select id="orient">
        <option value="auto">Detect</option>
        <option value="w">White at bottom</option>
        <option value="b">Black at bottom</option>
      </select>
    </label>
    <button id="autoBtn">Find the board again automatically</button>
    <hr>
    <button id="flipBtn">Flip board</button>
    <button id="marksBtn" aria-pressed="true">Show arrows from the video</button>
    <button id="copyBtn">Copy FEN</button>
    <a id="lichessBtn" target="_blank" rel="noopener" href="#">Analyze on Lichess</a>
  </div>
  <input type="file" id="fileInput" accept="video/*" hidden>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module">
import { readVideo, warmUp, openVideo, closeVideo, seek } from './read.js';
const $ = s => document.querySelector(s);
const FILES = 'abcdefgh';
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- board helpers ---------- */
function fenToBoard(fen){
  const b = new Array(64).fill('.');
  const rows = fen.split(' ')[0].split('/');
  for (let r = 0; r < 8; r++){
    let f = 0;
    for (const ch of rows[r]){
      if (ch >= '1' && ch <= '8') f += +ch;
      else { b[(7 - r) * 8 + f] = ch; f++; }
    }
  }
  return b;
}
function boardToPlacement(b){
  let s = '';
  for (let r = 7; r >= 0; r--){
    let e = 0;
    for (let f = 0; f < 8; f++){
      const c = b[r * 8 + f];
      if (c === '.' || c === '?') e++;
      else { if (e){ s += e; e = 0; } s += c; }
    }
    if (e) s += e;
    if (r) s += '/';
  }
  return s;
}
/* ---------- 3D board ---------- */
const sceneEl = $('#scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
sceneEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
const orbit = { az: 0, pol: 0.74, base: 13, zoom: 1, azTarget: 0 };

scene.add(new THREE.HemisphereLight(0xf4f1e6, 0x2a3530, 0.42));
const key = new THREE.DirectionalLight(0xfff4e0, 0.8);
key.position.set(-5, 11, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
key.shadow.bias = -0.0005;
key.shadow.radius = 3;
scene.add(key);
const fill = new THREE.DirectionalLight(0xd8e6ff, 0.28);
fill.position.set(6, 5, -6);
scene.add(fill);

function canvasTex(size, draw){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const boardTex = canvasTex(1024, (g, n) => {
  const q = n / 8;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++){
    g.fillStyle = (r + f) % 2 === 0 ? '#d9cdae' : '#56744f';
    g.fillRect(f * q, r * q, q, q);
  }
  // faint vinyl grain
  const img = g.getImageData(0, 0, n, n), d = img.data;
  for (let i = 0; i < d.length; i += 4){ const k = (Math.random() - 0.5) * 7; d[i] += k; d[i + 1] += k; d[i + 2] += k; }
  g.putImageData(img, 0, 0);
});
const frameTex = canvasTex(1152, (g, n) => {
  g.fillStyle = '#1f2a24'; g.fillRect(0, 0, n, n);
  const u = n / 9.2, off = 0.6 * u;
  g.fillStyle = '#cfa95f';
  g.font = `600 ${u * 0.3}px "Instrument Sans", system-ui, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 8; i++){
    const x = off + (i + 0.5) * u;
    g.fillText(FILES[i], x, n - off / 2);
    g.save(); g.translate(x, off / 2); g.rotate(Math.PI); g.fillText(FILES[i], 0, 0); g.restore();
    const y = off + (7 - i + 0.5) * u;
    g.fillText(String(i + 1), off / 2, y);
    g.save(); g.translate(n - off / 2, y); g.rotate(Math.PI); g.fillText(String(i + 1), 0, 0); g.restore();
  }
});
const frameSide = new THREE.MeshStandardMaterial({ color: 0x1b241f, roughness: 0.6 });
const frame = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.42, 9.2), [
  frameSide, frameSide, new THREE.MeshStandardMaterial({ map: frameTex, roughness: 0.55 }), frameSide, frameSide, frameSide,
]);
frame.position.y = -0.21; frame.receiveShadow = true; scene.add(frame);
const top = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ map: boardTex, roughness: 0.72 }));
top.rotation.x = -Math.PI / 2; top.position.y = 0.002; top.receiveShadow = true; scene.add(top);

/* last-move squares: a bright yellow wash with a solid rim, so the rim still shows around a piece's base;
   the destination square is a little stronger than the origin */
const hlTex = (fill, rim) => canvasTex(128, (g, n) => {
  g.fillStyle = fill; g.fillRect(0, 0, n, n);
  const w = n * 0.07;
  g.strokeStyle = rim; g.lineWidth = w; g.strokeRect(w / 2, w / 2, n - w, n - w);
});
const hlMats = [
  new THREE.MeshBasicMaterial({ map: hlTex('rgba(255, 214, 51, 0.55)', 'rgba(255, 196, 0, 0.95)'), transparent: true, depthWrite: false }),
  new THREE.MeshBasicMaterial({ map: hlTex('rgba(255, 214, 51, 0.72)', 'rgba(255, 186, 0, 1)'), transparent: true, depthWrite: false }),
];
const hl = hlMats.map(mat => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); m.rotation.x = -Math.PI / 2; m.position.y = 0.006; m.visible = false; scene.add(m); return m; });

const sqPos = i => new THREE.Vector3((i % 8) - 3.5, 0, 3.5 - Math.floor(i / 8));
const sqIndex = name => (+name[1] - 1) * 8 + FILES.indexOf(name[0]);

/* arrows, circles and coloured squares the streamer draws; arrows arc over the pieces and
   draw on top of everything, so a piece never hides one */
const MARK_COLOURS = { green: 0x3fae49, red: 0xe0483e, blue: 0x3b82e0, orange: 0xf0a020 };
const markMats = {};
function markMat(colour, kind){
  const k = colour + kind;
  if (!markMats[k]) markMats[k] = new THREE.MeshBasicMaterial({
    color: new THREE.Color(MARK_COLOURS[colour] || MARK_COLOURS.orange).convertSRGBToLinear(),
    transparent: true, opacity: kind === 'square' ? 0.5 : 0.9,
    side: THREE.DoubleSide, depthWrite: false, depthTest: kind !== 'arrow',
  });
  return markMats[k];
}
function arrowGeometry(from, to){
  const a = sqPos(sqIndex(from)), b = sqPos(sqIndex(to));
  a.y = b.y = 0.04;
  const top = a.clone().add(b).multiplyScalar(0.5);
  top.y = 2 * Math.min(0.75, 0.15 + 0.07 * a.distanceTo(b));  // a quadratic curve peaks at half its control point
  const curve = new THREE.QuadraticBezierCurve3(a, top, b);
  const side = new THREE.Vector3(b.z - a.z, 0, a.x - b.x).normalize();
  const W = 0.085, HEAD_W = 0.3, HEAD_L = 0.45, N = 48;  // half widths
  const shaftEnd = 1 - HEAD_L / curve.getLength();
  const pos = [], idx = [];
  for (let i = 0; i <= N; i++){
    const p = curve.getPointAt(shaftEnd * i / N);
    pos.push(p.x + side.x * W, p.y, p.z + side.z * W, p.x - side.x * W, p.y, p.z - side.z * W);
    if (i) idx.push(2 * i - 2, 2 * i - 1, 2 * i, 2 * i - 1, 2 * i + 1, 2 * i);
  }
  const h = curve.getPointAt(shaftEnd), k = pos.length / 3;
  pos.push(h.x + side.x * HEAD_W, h.y, h.z + side.z * HEAD_W, h.x - side.x * HEAD_W, h.y, h.z - side.z * HEAD_W, b.x, b.y, b.z);
  idx.push(k, k + 1, k + 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
const marksGroup = new THREE.Group(); scene.add(marksGroup);
const ringGeo = new THREE.RingGeometry(0.38, 0.46, 48), squareGeo = new THREE.PlaneGeometry(1, 1);
function flatMark(geo, mat, sq, y){
  const m = new THREE.Mesh(geo, mat); m.rotation.x = -Math.PI / 2;
  const p = sqPos(sqIndex(sq)); m.position.set(p.x, y, p.z);
  marksGroup.add(m);
}
function drawMarks(m){
  for (const o of marksGroup.children.slice()){
    if (o.geometry !== ringGeo && o.geometry !== squareGeo) o.geometry.dispose();
    marksGroup.remove(o);
  }
  if (m){
    for (const q of m.squares || []) flatMark(squareGeo, markMat(q.color, 'square'), q.sq, 0.004);
    for (const c of m.circles || []) flatMark(ringGeo, markMat(c.color, 'circle'), c.sq, 0.009);
    for (const a of m.arrows || []){
      const mesh = new THREE.Mesh(arrowGeometry(a.from, a.to), markMat(a.color, 'arrow'));
      mesh.renderOrder = 10; marksGroup.add(mesh);
    }
  }
  dirty = true;
}

/* piece geometry */
const V2 = (r, y) => new THREE.Vector2(r, y);
function arc(cy, rad, a0, a1, n = 10){
  const pts = [];
  for (let i = 0; i <= n; i++){ const a = a0 + (a1 - a0) * i / n; pts.push([Math.max(0, rad * Math.sin(a)), cy - rad * Math.cos(a)]); }
  return pts;
}
const BASE = [[0, 0], [0.34, 0], [0.345, 0.04], [0.33, 0.07], [0.3, 0.09], [0.3, 0.11], [0.25, 0.13]];
function lathe(pts){
  const g = new THREE.LatheGeometry(pts.map(([r, y]) => V2(r, y)), 48);
  g.computeVertexNormals();
  return g;
}
const GEO = {};
GEO.p = [lathe([...BASE, [0.2, 0.16], [0.14, 0.23], [0.11, 0.33], [0.1, 0.38], [0.165, 0.4], [0.165, 0.43], [0.085, 0.45], ...arc(0.545, 0.118, 0.8, Math.PI)])];
GEO.r = (() => {
  const body = lathe([...BASE, [0.23, 0.16], [0.2, 0.22], [0.18, 0.5], [0.22, 0.54], [0.25, 0.57], [0.25, 0.72], [0.17, 0.72], [0.17, 0.66], [0, 0.66]]);
  const parts = [body];
  for (let i = 0; i < 6; i++){
    const b = new THREE.BoxGeometry(0.11, 0.08, 0.08);
    b.translate(0, 0.76, 0.21);
    b.rotateY(i * Math.PI / 3);
    parts.push(b);
  }
  return parts;
})();
GEO.b = [lathe([...BASE, [0.21, 0.16], [0.14, 0.24], [0.1, 0.42], [0.17, 0.46], [0.17, 0.49], [0.1, 0.51],
  ...arc(0.665, 0.16, 0.68, Math.PI * 0.92, 12).map(([r, y]) => [r * 0.9, y]), [0.03, 0.83], ...arc(0.875, 0.045, 0.6, Math.PI)])];
GEO.q = (() => {
  const body = lathe([...BASE, [0.22, 0.16], [0.15, 0.25], [0.11, 0.52], [0.11, 0.58], [0.2, 0.62], [0.2, 0.65], [0.12, 0.68],
    [0.15, 0.74], [0.215, 0.84], [0.215, 0.865], [0.14, 0.87], [0.1, 0.92], ...arc(0.97, 0.055, 0.9, Math.PI)]);
  const parts = [body];
  for (let i = 0; i < 9; i++){
    const s = new THREE.SphereGeometry(0.036, 12, 10);
    s.translate(Math.cos(i * Math.PI * 2 / 9) * 0.2, 0.885, Math.sin(i * Math.PI * 2 / 9) * 0.2);
    parts.push(s);
  }
  return parts;
})();
GEO.k = (() => {
  const body = lathe([...BASE, [0.23, 0.16], [0.16, 0.25], [0.12, 0.54], [0.12, 0.63], [0.21, 0.67], [0.21, 0.7], [0.13, 0.73],
    [0.17, 0.8], [0.205, 0.9], [0.205, 0.925], [0.11, 0.955], [0.06, 0.985], [0, 0.995]]);
  const v = new THREE.BoxGeometry(0.06, 0.22, 0.06); v.translate(0, 1.09, 0);
  const h = new THREE.BoxGeometry(0.17, 0.06, 0.06); h.translate(0, 1.11, 0);
  return [body, v, h];
})();
GEO.n = (() => {
  const base = lathe([...BASE, [0.23, 0.16], [0.21, 0.2], [0, 0.2]]);
  const pts = [[-0.22, 0.17], [0.2, 0.17], [0.17, 0.27], [0.07, 0.4], [0.11, 0.46], [0.27, 0.5], [0.33, 0.56], [0.31, 0.63],
    [0.15, 0.71], [0.09, 0.79], [0.04, 0.88], [-0.02, 0.81], [-0.1, 0.79], [-0.2, 0.68], [-0.25, 0.5], [-0.25, 0.3]];
  const shape = new THREE.Shape(pts.map(([x, y]) => V2(x, y)));
  const head = new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.035, bevelSegments: 3, curveSegments: 6 });
  head.translate(0, 0, -0.08);
  head.computeVertexNormals();
  return [base, head];

  const old = view.board, meshes = view.meshes;

  }

      if (d < bestD){ bestD = d; bestR = r; }

    if (used.has(r)) continue;

    if (now < t.t0 && t.kind !== 'move') continue;

  const d = dragBox, cb = contentBox();
  dragStart = null; dragBox = null;
  if (!d || d.w < 20 || d.h < 20 || !cb){ drawOverlay(); return; }
  const box = { x: Math.max(0, (d.x - cb.x) / cb.s), y: Math.max(0, (d.y - cb.y) / cb.s), w: d.w / cb.s, h: d.h / cb.s };
  S.region = [box.x, box.y, box.w, box.h]; S.manual = true;
  endFix(true);
  restart(S.region);
});
/* read the video again with new settings (once it's here: until then they just wait) */
function restart(region){
  if (!S.source) return;
  if (S.src){
    hint('Reading the video again with the new settings\u2026');
    startReading(region);
  } else {
    clearReading();
    S.status = 'downloading';
    statusHint();
    pollDownload();
  }
}

/* buttons and menu */
function updateButtons(){
  $('#cropBtn').disabled = !S.region;
  $('#fixBtn').disabled = !S.src || !['processing', 'done', 'error'].includes(S.status);
}
$('#urlForm').addEventListener('submit', e => { e.preventDefault(); startYouTube($('#ytUrl').value.trim()); });
$('#fileBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) startUpload(f); e.target.value = ''; };
$('#newBtn').onclick = () => showEmpty();
$('#orient').onchange = () => { $('#orient').options[0].textContent = 'Detect'; restart(S.region); };
$('#autoBtn').onclick = () => { S.region = null; S.manual = false; setCrop(false); restart(null); };
function setShowMarks(on){
  S.showMarks = on; marksGroup.visible = on; dirty = true;
  $('#marksBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  try { localStorage.setItem('shadowboard.marks', on ? '1' : '0'); } catch (e) {}
}
$('#marksBtn').onclick = () => setShowMarks(!S.showMarks);
try { if (localStorage.getItem('shadowboard.marks') === '0') setShowMarks(false); } catch (e) {}
$('#copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(S.fen); hint('FEN copied.'); } catch (e) { hint(S.fen); }
};
const menu = $('#menu'), moreBtn = $('#moreBtn');
function closeMenu(){ menu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); }
moreBtn.onclick = e => { e.stopPropagation(); const open = menu.hidden; menu.hidden = !open; moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); };
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMenu(); if (S.fixing) endFix(); } });
menu.addEventListener('click', e => { if (e.target.closest('button')) setTimeout(closeMenu, 0); });

/* pinch to zoom the 3D board on touch screens */
const touches = new Map();
let pinch0 = null;
cv.addEventListener('pointerdown', e => { touches.set(e.pointerId, e); if (touches.size === 2){ drag = null; const [a, b] = [...touches.values()]; pinch0 = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: orbit.zoom }; } });
cv.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, e);
  if (pinch0 && touches.size === 2){
    drag = null;
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    orbit.zoom = Math.min(1.7, Math.max(0.55, pinch0.z * pinch0.d / Math.max(d, 1)));
    dirty = true;
  }
});
const endTouch = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch0 = null; };
cv.addEventListener('pointerup', endTouch); cv.addEventListener('pointercancel', endTouch);

sync3D(fenToBoard(START_FEN), false);
resize3D();
requestAnimationFrame(loop);
updateButtons();
resume();
window.__sb = { S, playerTime };
</script>
