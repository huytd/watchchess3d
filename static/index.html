<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2e5de">
<title>Watch Chess in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#e2e5de; --panel:#f3f4f0; --ink:#1b241f; --muted:#5b665e; --line:#c9cfc6;
  --accent:#8a6a24; --accent-ink:#ffffff; --stage:#151b17; --stage-ink:#e3e9e1; --danger:#a33a2a;
  --shadow:0 10px 30px rgba(20,28,24,0.18), 0 2px 6px rgba(20,28,24,0.12);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e2722; --panel:#232d27; --ink:#e8e7dd; --muted:#9aa69c; --line:#38463e;
    --accent:#cfa95f; --accent-ink:#1a221d; --stage:#0e1310; --danger:#e48a73;
    --shadow:0 10px 30px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1e2722; --panel:#232d27; --ink:#e8e7dd; --muted:#9aa69c; --line:#38463e;
  --accent:#cfa95f; --accent-ink:#1a221d; --stage:#0e1310; --danger:#e48a73;
  --shadow:0 10px 30px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%; margin:0; overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14px; line-height:1.4;
}
img,video,canvas{max-width:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* the board fills the page */
.scene{position:fixed; inset:0; background:var(--bg)}
/* with a table, a soft vignette makes it feel lit by a lamp over the board */
.scene.table::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 45%, transparent 45%, rgba(0,0,0,0.38) 100%)}
.scene canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
.scene canvas:active{cursor:grabbing}

/* camera controls, top right */
.camera{
  position:fixed; z-index:2; top:calc(16px + env(safe-area-inset-top,0px)); right:calc(16px + env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px;
  background:rgba(12,16,14,0.6); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); box-shadow:0 4px 14px rgba(0,0,0,0.25);
}
.cam{
  position:relative; flex:none; width:34px; height:34px; display:grid; place-items:center; padding:0; margin:0;
  border:0; border-radius:50%; cursor:pointer; color:var(--stage-ink); background:transparent; transition:background .15s ease;
}
.cam svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.cam:hover{background:rgba(255,255,255,0.12)}
.cam[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.cam-sep{flex:none; width:1px; height:20px; margin:0 3px; background:rgba(255,255,255,0.2)}
@media (hover:hover){
  .cam::after{
    content:attr(data-tip); position:absolute; top:calc(100% + 10px); right:0; white-space:nowrap; pointer-events:none;
    font-size:12px; font-weight:500; padding:4px 8px; border-radius:8px; color:var(--stage-ink); background:rgba(12,16,14,0.85);
    opacity:0; transition:opacity .15s ease;
  }
  .cam:hover::after, .cam:focus-visible::after{opacity:1}
}

/* floating video card, bottom left */
.card{
  position:fixed; z-index:2;
  left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:clamp(300px, 30vw, 620px);
  background:var(--stage); border-radius:16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; transition:width .25s ease;
}
.card.expanded{width:min(62vw, 1100px)}
.card.cropped{width:clamp(360px, 24vw, 460px)}
.stage{
  position:relative; aspect-ratio:16/9; background:var(--stage); overflow:hidden; border-radius:16px;
}
.card.cropped .stage{aspect-ratio:var(--ar, 1)}
.stage video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
.card.cropped .stage video{inset:auto; object-fit:fill}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.stage.drawing canvas{pointer-events:auto; cursor:crosshair; touch-action:none}
.empty{
  position:absolute; inset:0; color:var(--stage-ink); padding:16px 18px;
  display:flex; flex-direction:column; justify-content:center; gap:10px; overflow:auto;
}
.empty .lead{margin:0; font-size:17px; font-weight:600}
.empty .small{margin:0; color:#aab5ac; font-size:13px}
.empty input{
  flex:1 1 140px; min-width:0; font:inherit; color:var(--stage-ink); background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18); border-radius:999px; padding:7px 12px;
}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{
  font:inherit; font-weight:600; font-size:13px; padding:7px 12px; border-radius:999px;
  border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.empty .btn{color:var(--stage-ink); border-color:rgba(255,255,255,0.25)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn[aria-pressed="true"]{background:color-mix(in srgb, var(--accent) 18%, transparent); border-color:var(--accent)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.icon{padding:7px 10px; font-size:15px; line-height:1}
#trackBtn.on{background:transparent; color:var(--ink); border-color:var(--accent)}
#trackBtn.on::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--accent)}

/* controls above the video, clear of YouTube's own: crop (top left), status, settings (top right) */
.tools{
  position:absolute; z-index:2; left:0; right:0; bottom:calc(100% + 8px);
  --tool:36px; display:grid; grid-template-columns:var(--tool) 1fr var(--tool); align-items:end; gap:8px; pointer-events:none;
}
.tools > .tool, .status button{pointer-events:auto}
.tool{
  flex:none; width:var(--tool); height:var(--tool); display:grid; place-items:center; padding:0; margin:0;
  border:0; border-radius:50%; cursor:pointer; color:#fff;
  background:rgba(12,16,14,0.6); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:background .15s ease;
}

.tool svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.tool:hover{background:rgba(12,16,14,0.8)}
.tool[aria-pressed="true"], .tool[aria-expanded="true"]{background:var(--accent); color:var(--accent-ink)}
.tools #cropBtn{grid-column:1}
.tools .status{grid-column:2; justify-self:center}
.tools .settings{grid-column:3}
.status{
  margin:0; min-width:0; max-width:100%; padding:6px 12px; border-radius:14px;
  color:var(--stage-ink); font-size:12.5px; line-height:1.35; text-align:center;
  background:rgba(12,16,14,0.6); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  transition:opacity .4s ease;
}
.status:empty{display:none}
.status.warn{color:#f6b3a2}
.status.quiet{opacity:0; pointer-events:none}
.status button{font:inherit; font-weight:600; color:var(--accent); background:none; border:0; padding:0 0 0 6px; cursor:pointer}

/* settings: a popover above the video card, a bottom sheet on phones */
.menu-backdrop{display:none}
.menu{
  position:absolute; right:0; bottom:calc(100% + 56px); z-index:4;
  width:270px; max-height:min(70vh, 560px); overflow:auto; overscroll-behavior:contain;
  background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  padding:6px; display:flex; flex-direction:column;
}
.menu .sheet-head{display:none}
.menu button, .menu a{
  font:inherit; text-align:left; background:none; border:0; color:var(--ink); padding:8px 10px;
  border-radius:8px; cursor:pointer; text-decoration:none;
}
.menu button:hover:not(:disabled), .menu a:hover{background:color-mix(in srgb, var(--ink) 7%, transparent)}
.menu button:disabled{opacity:.4; cursor:default}
.menu button[aria-pressed="true"]::after{content:" \2713"; color:var(--accent)}
.menu label{display:flex; flex-direction:column; gap:4px; padding:6px 10px; color:var(--muted); font-size:12.5px}
.menu select{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px}
.menu hr{border:0; border-top:1px solid var(--line); margin:4px 6px}
.menu .swatches{display:flex; gap:6px; padding:0 10px 6px}
.menu .swatches label{flex:1; flex-direction:row; align-items:center; gap:6px; padding:0; color:var(--ink); font-size:13px}
.menu input[type="checkbox"]{margin:0; accent-color:var(--accent)}
.menu input[type="color"]{width:30px; height:26px; padding:2px; border:1px solid var(--line); border-radius:6px; background:var(--bg); cursor:pointer}

@media (max-width:700px){
  .card, .card.cropped, .card.expanded{
    left:calc(8px + env(safe-area-inset-left,0px)); right:calc(8px + env(safe-area-inset-right,0px));
    bottom:calc(8px + env(safe-area-inset-bottom,0px)); width:auto;
  }
  .card.cropped{width:min(72vw, 300px); right:auto}
  .tools{--tool:40px}
  .camera{top:calc(8px + env(safe-area-inset-top,0px)); right:calc(8px + env(safe-area-inset-right,0px)); padding:3px}
  .cam{width:32px; height:32px}
  .cam-sep{margin:0 2px}
  /* 16px stops iOS zooming into a field when it gets focus */
  .empty input, .menu select{font-size:16px}
}
/* settings as a bottom sheet on phones, upright or sideways */
@media (max-width:700px), (max-height:500px){
  .menu-backdrop{display:block; position:fixed; inset:0; z-index:3; background:rgba(0,0,0,0.4)}
  .menu-backdrop[hidden]{display:none}
  .menu{
    position:fixed; left:0; right:0; bottom:0; width:auto; max-width:560px; margin:0 auto; max-height:min(80vh, 640px);
    border-radius:18px 18px 0 0; border-width:1px 0 0; padding:4px 10px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .menu .sheet-head{
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:-4px; z-index:1;
    margin:0 -10px 4px; padding:10px 12px 8px 20px; background:var(--panel); border-bottom:1px solid var(--line);
    font-weight:600; font-size:16px;
  }
  .menu .sheet-head button{font-size:22px; line-height:1; padding:4px 10px}
  .menu button, .menu a{padding:12px 10px; font-size:15px}
  .menu label{font-size:13px}
  .menu .swatches label{font-size:14px}
  .menu input[type="color"]{width:38px; height:32px}
  .menu input[type="checkbox"]{width:20px; height:20px}
}

/* server version additions */
.stage #yt, .stage iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.card.cropped .stage #yt, .card.cropped .stage iframe, .card.cropped .stage video{inset:auto}
.stage .still{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
.progress{position:absolute; left:0; right:0; top:0; z-index:2; height:3px; pointer-events:none; transition:opacity .6s ease}
.progress.done{opacity:0}
.progress span{display:block; height:100%; width:0; background:var(--accent); transition:width .4s ease}
.empty form{display:flex; gap:8px; flex-wrap:wrap}
/* with nothing loaded the card grows to fit what it offers, the series to pick an episode from */
.card.idle .stage{aspect-ratio:auto}
.card.idle .empty{position:relative; inset:auto}
.series{display:flex; flex-direction:column; gap:10px; margin-top:6px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.1)}
.series-head{display:flex; align-items:center; gap:8px}
.series-tabs{display:flex; gap:4px; padding:3px; border-radius:999px; background:rgba(255,255,255,0.06); min-width:0; overflow-x:auto; scrollbar-width:none}
.series-tabs button{
  font:inherit; font-size:13px; font-weight:600; color:#aab5ac; background:none; border:0; border-radius:999px;
  padding:5px 12px; cursor:pointer; white-space:nowrap;
}
.series-tabs button span{font-weight:500; opacity:.7; margin-left:5px}
.series-tabs button:hover{color:var(--stage-ink)}
.series-tabs button[aria-selected="true"]{background:rgba(255,255,255,0.14); color:var(--stage-ink)}
.series-nav{display:flex; gap:4px; margin-left:auto}
.series-nav button{
  width:30px; height:30px; display:grid; place-items:center; padding:0; border-radius:50%; cursor:pointer;
  color:var(--stage-ink); background:none; border:1px solid rgba(255,255,255,0.2);
}
.series-nav button:disabled{opacity:.3; cursor:default}
.series-nav svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
@media (hover:none){ .series-nav{display:none} }
.episodes{
  display:grid; grid-auto-flow:column; grid-auto-columns:156px; gap:10px; overflow-x:auto; overscroll-behavior-x:contain;
  scroll-snap-type:x proximity; scroll-padding:0 2px; padding:2px 2px 8px; margin:0 -2px; scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.2) transparent;
}
.ep{
  display:flex; flex-direction:column; gap:6px; padding:0; margin:0; border:0; background:none; color:var(--stage-ink);
  font:inherit; text-align:left; cursor:pointer; scroll-snap-align:start; min-width:0;
}
.ep .thumb{position:relative; display:block; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:rgba(255,255,255,0.06)}
.ep img{display:block; width:100%; height:100%; object-fit:cover; transition:transform .2s ease}
.ep:hover img{transform:scale(1.04)}
.ep:focus-visible{outline:none}
.ep:focus-visible .thumb{outline:2px solid var(--accent); outline-offset:2px}
.ep .dur, .ep .tag{position:absolute; font-size:11px; font-weight:600; line-height:1; padding:3px 5px; border-radius:5px}
.ep .dur{right:5px; bottom:5px; color:#fff; background:rgba(0,0,0,0.75)}
.ep .tag{left:5px; top:5px; color:var(--accent-ink); background:var(--accent)}
.ep .tag.ready{color:#fff; background:rgba(12,16,14,0.8)}
.ep.watched .thumb::after{content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--accent)}
.ep.watched img{opacity:.6}
.ep .title{
  font-size:12.5px; font-weight:500; line-height:1.3; color:#d6ddd4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.ep .n{font-size:11.5px; color:#8f9a91}
.empty .or{display:flex; align-items:center; gap:8px; color:#aab5ac; font-size:13px}
.empty .err{color:#f0a08c; margin:0; font-size:13px}
</style>
</head>
<body>
<div class="scene" id="scene" aria-label="3D chess board. Drag to rotate, pinch or scroll to zoom."></div>

<nav class="camera" id="camBar" aria-label="Camera">
  <button class="cam" id="swayBtn" aria-pressed="false" data-tip="Auto-rotate" aria-label="Auto-rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 15.6c2.4-.8 4-2.1 4-3.6 0-2.5-4-4.5-9-4.5S3 9.5 3 12s4 4.5 9 4.5"/><path d="m9.5 14 2.5 2.5L9.5 19"/></svg></button>
  <span class="cam-sep" aria-hidden="true"></span>
  <button class="cam" data-view="overview" aria-pressed="false" data-tip="Overview" aria-label="Overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h10l4 12H3z"/><path d="M5 12h14M10.3 6l-1 12M13.7 6l1 12"/></svg></button>
  <button class="cam" data-view="top" aria-pressed="false" data-tip="Top down" aria-label="Top down"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h16M12 4v16"/></svg></button>
  <button class="cam" data-view="player" aria-pressed="false" data-tip="Player's eye" aria-label="Player's eye view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="cam" data-view="side" aria-pressed="false" data-tip="From the side" aria-label="View from the side"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19h20"/><path d="M5 19v-3h4v3M15 19v-7h4v7"/><path d="M15 12V9.5M19 12V9.5"/><circle cx="7" cy="13.5" r="1.5"/></svg></button>
  <button class="cam" data-view="table" aria-pressed="false" data-tip="Whole table" aria-label="Whole table"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></svg></button>
  <span class="cam-sep" aria-hidden="true"></span>
  <button class="cam" id="camFlip" data-tip="Other side" aria-label="View from the other side"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20V4M3.5 7.5 7 4l3.5 3.5M17 4v16M13.5 16.5 17 20l3.5-3.5"/></svg></button>
</nav>

<aside class="card idle" id="card" aria-label="Video">
  <div class="tools" id="tools">
    <button class="tool" id="cropBtn" aria-pressed="false" hidden title="Show only the board" aria-label="Show only the board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></button>
    <p class="status" id="hint" role="status" aria-live="polite"></p>
    <button class="tool settings" id="moreBtn" aria-expanded="false" aria-controls="menu" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <div id="yt"></div>
    <video id="video" playsinline controls hidden></video>
    <canvas class="still" id="still" hidden></canvas>
    <canvas id="overlay"></canvas>
    <div class="empty" id="empty">
      <p class="lead">Follow a chess video in 3D</p>
      <form id="urlForm">
        <input type="url" id="ytUrl" placeholder="Paste a YouTube link" aria-label="YouTube link" required>
        <button class="btn primary" style="color:var(--accent-ink)">Load</button>
      </form>
      <div class="or">or <button class="btn" id="fileBtn" type="button">upload a video file</button></div>
      <p class="err" id="emptyErr" hidden></p>
      <section class="series" id="series" aria-label="Series to watch" hidden>
        <div class="series-head">
          <div class="series-tabs" id="seriesTabs" role="tablist" aria-label="Series"></div>
          <div class="series-nav">
            <button type="button" id="epPrev" aria-label="Earlier episodes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <button type="button" id="epNext" aria-label="Later episodes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="episodes" id="episodes" role="tabpanel"></div>
      </section>
    </div>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
  </div>
  <div class="menu-backdrop" id="menuBackdrop" hidden></div>
  <div class="menu" id="menu" role="dialog" aria-label="Settings" hidden>
    <div class="sheet-head">Settings <button id="menuClose" aria-label="Close settings">&times;</button></div>
    <button id="newBtn">Another video</button>
    <hr>
    <label>Orientation in the video
      <select id="orient">
        <option value="auto">Detect</option>
        <option value="w">White at bottom</option>
        <option value="b">Black at bottom</option>
      </select>
    </label>
    <button id="fixBtn" aria-pressed="false" disabled>Draw the board area yourself</button>
    <button id="autoBtn">Find the board again automatically</button>
    <hr>
    <button id="flipBtn">Flip board</button>
    <button id="marksBtn" aria-pressed="true">Show arrows from the video</button>
    <hr>
    <label>Board colours
      <select id="boardTheme"></select>
    </label>
    <div class="swatches">

function fenToBoard(fen){
  const b = new Array(64).fill('.');

  for (let r = 0; r < 8; r++){
    let f = 0;
    for (const ch of rows[r]){
      if (ch >= '1' && ch <= '8') f += +ch;
      else { b[(7 - r) * 8 + f] = ch; f++; }

}

      const c = b[r * 8 + f];
      if (c === '.' || c === '?') e++;
      else { if (e){ s += e; e = 0; } s += c; }
    }

}

function drawSheet(g, w, h, rows, firstRow){

/* a digital chess clock: a wedge with the two times on its sloping face and a rocker on top,

const CONTROLS = [[180, 2], [300, 0], [300, 3], [600, 0], [600, 5], [900, 10]];
const clock = { mesh: null, tex: null, rockers: [], time: { w: 0, b: 0 }, inc: 0, lastT: null, shown: '', leftColour: 'w', side: 1 };

function makeClock(){

  clock.tex = canvasTex(512, () => {}); clock.tex.image.width = 512; clock.tex.image.height = 160;

const view = { board: new Array(64).fill('.'), meshes: new Array(64).fill(null) };
const tweens = [];
function sync3D(next, animate){
  const old = view.board, meshes = view.meshes;
  const removed = [], added = [];
  for (let i = 0; i < 64; i++){
    if (old[i] !== next[i]){ if (old[i] !== '.') removed.push(i); if (next[i] !== '.') added.push(i); }
  }
  const used = new Set(), nm = meshes.slice();
  for (const r of removed) nm[r] = null;
  const now = performance.now(), dur = animate ? (reduceMotion ? 120 : 420) : 0;
  for (const a of added){
    let bestR = -1, bestD = 1e9;
    for (const r of removed){
      if (used.has(r) || old[r] !== next[a]) continue;
      const d = Math.hypot((r % 8) - (a % 8), (r >> 3) - (a >> 3));
      if (d < bestD){ bestD = d; bestR = r; }
    }
    if (bestR >= 0){
      used.add(bestR);
      const g = meshes[bestR]; nm[a] = g;
      const isKnight = next[a].toLowerCase() === 'n';
      tweens.push({ obj: g, kind: 'move', from: g.position.clone(), to: sqPos(a), t0: now, dur, hop: reduceMotion ? 0 : (isKnight ? 0.55 : Math.min(0.25, 0.06 * bestD)) });
    } else {
      const g = makePiece(next[a]); g.position.copy(sqPos(a)); scene.add(g); nm[a] = g;
      g.scale.setScalar(dur ? 0.001 : 1);
      if (dur) tweens.push({ obj: g, kind: 'appear', t0: now + dur * 0.4, dur: dur * 0.8 });
    }
  }
  for (const r of removed){
    if (used.has(r)) continue;
    const g = meshes[r];
    if (!g) continue;
    if (dur) tweens.push({ obj: g, kind: 'vanish', t0: now + dur * 0.55, dur: dur * 0.6 });
    else scene.remove(g);
  }

  for (let i = tweens.length - 1; i >= 0; i--){
    const t = tweens[i];
    const k = t.dur ? Math.min(1, Math.max(0, (now - t.t0) / t.dur)) : 1;
    if (now < t.t0 && t.kind !== 'move') continue;
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    if (t.kind === 'move'){

      t.obj.position.y = Math.sin(Math.PI * e) * t.hop;
    } else if (t.kind === 'appear'){
      t.obj.scale.setScalar(Math.max(0.001, e));
    } else if (t.kind === 'vanish'){
      t.obj.scale.setScalar(Math.max(0.001, 1 - e));

/* auto-rotate: swing slowly left and right around wherever the camera is pointed, about 25° each
   way over two and a half minutes, never faster than about 1° a second, so it doesn't pull the eye */
const SWAY = { on: false, phase: 0, amp: 0.45, period: 140 };
function setSway(on){
  if (!on && SWAY.on){
    // stop where it is
    orbit.az += orbit.sway; orbit.azTarget += orbit.sway; orbit.sway = 0;
  }
  SWAY.on = on; SWAY.phase = 0;
  $('#swayBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  try { localStorage.setItem('shadowboard.sway', on ? '1' : '0'); } catch (e) {}
  dirty = true;
}
$('#swayBtn').onclick = () => setSway(!SWAY.on);
/* view the board from the same side as the video: White's side (az 0) or Black's (az π) */
function faceSide(whiteBottom){
  const want = whiteBottom ? 0 : Math.PI;
  turnTo(orbit.az + Math.atan2(Math.sin(want - orbit.az), Math.cos(want - orbit.az)));
}
/* which way up the video's board is can change from game to game, so follow the position on
   show (before the first one, the first game's) and turn when a game is played from the other side */
function faceVideo(){
  const ev = S.events[Math.max(S.idx, 0)];
  const wb = ev && ev.wb != null ? ev.wb : S.whiteBottom;
  if (wb == null || wb === S.viewWb) return;
  S.viewWb = wb;
  faceSide(wb);
  if ($('#orient').value === 'auto') $('#orient').options[0].textContent = 'Detect (now: ' + (wb ? 'White' : 'Black') + ' at bottom)';
}

function resize3D(){
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  // Fill the height on wide screens; back off on narrow ones so the whole board fits.
  orbit.base = 14.2 * Math.max(1, 1.45 / aspect);
  const wide = aspect > 1.15 && w > 700;
  // Wide: slide the board right, beside the video card. Tall: centre it in the room above the card,
  // as big as fits there.
  if (wide) camera.setViewOffset(w, h, -Math.round(w * 0.085), 0, w, h);
  else if (aspect < 0.9){
    const free = Math.max(h * 0.4, $('#tools').getBoundingClientRect().top);
    orbit.base = 14.2 * Math.max(1, 1.3 / aspect, 0.92 * h / free);
    camera.setViewOffset(w, h, 0, Math.round((h - free) / 2), w, h);
  }
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  dirty = true;
}
new ResizeObserver(resize3D).observe(sceneEl);
let dirty = true;
let lastFrame = 0;
function loop(now){
  let moving = false;
  const dt = Math.min(0.1, (now - (lastFrame || now)) / 1000); lastFrame = now;
  // ease towards the targets at the same pace whatever the frame rate
  const k = 1 - Math.exp(-7 * (dt || 1 / 60));
  if (Math.abs(orbit.azTarget - orbit.az) > 0.001){ orbit.az += (orbit.azTarget - orbit.az) * k; moving = true; }
  if (Math.abs(orbit.polTarget - orbit.pol) > 0.0005){ orbit.pol += (orbit.polTarget - orbit.pol) * k; moving = true; }
  if (Math.abs(orbit.zoomTarget - orbit.zoom) > 0.0005){ orbit.zoom += (orbit.zoomTarget - orbit.zoom) * k; moving = true; }
  if (SWAY.on){
    SWAY.phase += dt * 2 * Math.PI / SWAY.period;
    orbit.sway = SWAY.amp * Math.sin(SWAY.phase);
    moving = true;
  }
  if (tweens.length){ runTweens(now); moving = true; }
  if (moving || dirty){
    placeCamera();
    renderer.render(scene, camera);
    dirty = false;
  }
  requestAnimationFrame(loop);
}


/* ---------- app ---------- */
const S = { source: null, videoId: null, src: null, events: [], status: null, error: null, region: null, manual: false,

/* starting: the server downloads YouTube videos; this page does all the reading */
function stopReading(){ S.reading = null; if (S.stop){ S.stop(); S.stop = null; } }

async function startYouTube(url){

  catch (e) { return showEmpty('Can\u2019t reach the server.'); }
  if (!r.ok) return showEmpty(r.status === 400 ? 'That doesn\u2019t look like a YouTube video link.' : 'The server couldn\u2019t start on that video.');
  const j = await r.json();

  history.replaceState(null, '', '#v=' + j.video_id);
  markWatched(j.video_id);
  setIdle(false);

  if (j.results){
    const res = await fetch(`/api/videos/${j.video_id}/results`).then(x => x.ok ? x.json() : null).catch(() => null);

async function pollDownload(){
  clearTimeout(S.pollTimer);

  let j;
  try {
    const r = await fetch('/api/videos/' + vid);
    if (r.status === 404) return startYouTube('https://youtu.be/' + vid);  // the server restarted
    j = await r.json();
  } catch (e) { S.pollTimer = setTimeout(pollDownload, 3000); return; }
  if (vid !== S.videoId) return;
  if (j.status === 'ready'){
    S.src = `/api/videos/${vid}/file`;
    if (S.status !== 'done') startReading();
    updateButtons();
    return;
  }
  if (j.status === 'error'){ if (S.status !== 'done') update({ status: 'error', error: j.error }); return; }
  if (S.status !== 'done'){
    S.download = j.download || 0;

}

/* the start card: a link, a file, or an episode of one of the series (from the server, which keeps

/* what the reader (or a saved reading) reports */
function update(u){
  for (const [list, add] of [[S.events, u.events || []], [S.marks, u.marks || []]]){
    for (const e of add){
      const prevT = list.length ? list[list.length - 1].t : 0;
      list.push({ ...e, t: Math.max(e.t, prevT) });
    }
  }
  if (u.status) S.status = u.status;
  if (u.status) S.error = u.status === 'error' ? u.error : null;
  if (u.progress != null) S.progress = u.progress;
  if (u.width){ S.W = u.width; S.H = u.height; S.duration = u.duration; }
  if (u.region){
    const had = !!S.region;
    S.region = u.region;
    if (!had) layoutPlayer(); else drawOverlay();
  }
  if (u.whiteBottom != null) S.whiteBottom = u.whiteBottom;
  faceVideo();
  $('#progress').style.width = (S.status === 'downloading' ? 100 * S.download : 100 * S.progress) + '%';
  $('#progress').parentElement.classList.toggle('done', S.status === 'done' || S.status === 'error');
  updateButtons();

}
/* share a finished reading of a YouTube video, so the next viewer of it can skip the work;
   only the automatic one: a board drawn by hand fits this viewer's needs, maybe not theirs */
function saveReading(){
  if (S.saved || S.source !== 'youtube' || S.manual || $('#orient').value !== 'auto') return;
  S.saved = true;
  const body = { version: 2, events: S.events, marks: S.marks, region: S.region, width: S.W, height: S.H, duration: S.duration, white_bottom: S.whiteBottom };
  fetch(`/api/videos/${S.videoId}/results`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
}

const ERRORS = {
  no_board: 'Couldn\u2019t find a chessboard in this video. Draw it under Settings \u203a Draw the board area yourself.',
  youtube_blocked: 'YouTube refused to let the server download this video (see the README about cookies).',
  too_long: 'This video is longer than the server allows.',
  download_failed: 'The server couldn\u2019t download this video.',
  unplayable: 'This browser can\u2019t open that video file.',
  worker_failed: 'Couldn\u2019t load the board reader. Check your connection and reload the page.',
};
function statusHint(){
  if (S.fixing) return;
  const moves = S.events.filter(e => e.san).length;
  switch (S.status){
    case 'downloading': return hint(`The server is fetching the video\u2026 ${Math.round(100 * S.download)}%`);
    case 'loading': return hint('Opening the video\u2026');
    case 'finding_board': return hint('Looking for the chessboard\u2026');
    case 'processing': {
      const done = S.progress * S.duration;
      return hint(`Reading moves: ${mmss(done)} of ${mmss(S.duration)}. You can press play.`);
    }
    case 'done': return hint(moves ? `Ready. ${moves} move${moves > 1 ? 's' : ''} found.` : 'Ready.');
    case 'error': return hint(ERRORS[S.error] || 'Something went wrong while reading this video.', true);
  }
}

/* keep the 3D board in step with the video */
function indexAt(list, t){
  let lo = 0, hi = list.length - 1, ans = -1;
  while (lo <= hi){ const mid = (lo + hi) >> 1; if (list[mid].t <= t){ ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}
function highlight(ev){
  if (ev && ev.from && ev.to){
    hl[0].position.set(sqPos(sqIndex(ev.from)).x, 0.006, sqPos(sqIndex(ev.from)).z);
    hl[1].position.set(sqPos(sqIndex(ev.to)).x, 0.006, sqPos(sqIndex(ev.to)).z);
    hl[0].visible = hl[1].visible = true;
  } else hl[0].visible = hl[1].visible = false;
  dirty = true;
}
setInterval(() => {
  if (!S.source) return;
  const t = playerTime() + 0.1;
  const i = indexAt(S.events, t);
  if (i !== S.idx){
    const step = i === S.idx + 1;
    S.idx = i;
    const ev = i >= 0 ? S.events[i] : null;
    S.fen = ev ? ev.fen : START_FEN;
    sync3D(fenToBoard(S.fen), step);
    highlight(ev);
    // the clock: an increment for whoever just moved, and the rocker down on their side
    if (step && ev && ev.san){ const moved = ev.fen.split(' ')[1] === 'w' ? 'b' : 'w'; clock.time[moved] += clock.inc; }
    setRockers(); drawClock();
    updateSheets();
    $('#lichessBtn').href = 'https://lichess.org/analysis/standard/' + S.fen.replace(/ /g, '_');
  }
  faceVideo();
  const mi = indexAt(S.marks, t);
  if (mi !== S.markIdx){ S.markIdx = mi; drawMarks(mi >= 0 ? S.marks[mi] : null); }
  if (S.status === 'processing' && !S.fixing){
    const done = S.progress * S.duration;
    if (t > done + 2) hint(`Still reading this part of the video (analyzed up to ${mmss(done)}).`);
    else statusHint();
  }
}, 150);

/* crop the card to the board */
function contentBox(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (!S.W || !S.H) return null;
  if (S.cropped && S.region){ const s = sw / S.region[2]; return { x: -S.region[0] * s, y: -S.region[1] * s, s }; }
  const s = Math.min(sw / S.W, sh / S.H);
  return { x: (sw - S.W * s) / 2, y: (sh - S.H * s) / 2, s };
}
function layoutPlayer(){

/* overlay: board outline, and drawing a board box by hand */
function resizeOverlay(){

  overlay.width = Math.round(stage.clientWidth * dpr); overlay.height = Math.round(stage.clientHeight * dpr);

new ResizeObserver(() => layoutPlayer()).observe(stage);

  S.fixing = false; dragBox = dragStart = null;
  card.classList.remove('expanded'); stage.classList.remove('drawing');
  $('#fixBtn').setAttribute('aria-pressed', 'false');
  still.hidden = true;
  drawOverlay();
  if (!silent) statusHint();
}
$('#fixBtn').onclick = startFix;
overlay.addEventListener('pointerdown', e => {
  if (!S.fixing) return;
  const b = overlay.getBoundingClientRect();
  dragStart = { x: e.clientX - b.left, y: e.clientY - b.top };
  dragBox = { ...dragStart, w: 0, h: 0 };
  overlay.setPointerCapture(e.pointerId);
});
overlay.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const b = overlay.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  dragBox = { x: Math.min(x, dragStart.x), y: Math.min(y, dragStart.y), w: Math.abs(x - dragStart.x), h: Math.abs(y - dragStart.y) };
  drawOverlay();
});
overlay.addEventListener('pointerup', async () => {
  if (!dragStart) return;
  const d = dragBox, cb = contentBox();
  dragStart = null; dragBox = null;
  if (!d || d.w < 20 || d.h < 20 || !cb){ drawOverlay(); return; }
  const box = { x: Math.max(0, (d.x - cb.x) / cb.s), y: Math.max(0, (d.y - cb.y) / cb.s), w: d.w / cb.s, h: d.h / cb.s };
  S.region = [box.x, box.y, box.w, box.h]; S.manual = true;
  endFix(true);
  restart(S.region);
});
/* read the video again with new settings (once it's here: until then they just wait) */
function restart(region){
  if (!S.source) return;
  if (S.src){
    hint('Reading the video again with the new settings\u2026');
    startReading(region);
  } else {
    clearReading();
    S.status = 'downloading';
    statusHint();
    pollDownload();
  }
}

/* buttons and menu */
function updateButtons(){
  $('#cropBtn').hidden = !S.region;
  $('#fixBtn').disabled = !S.src || !['processing', 'done', 'error'].includes(S.status);
}
$('#urlForm').addEventListener('submit', e => { e.preventDefault(); startYouTube($('#ytUrl').value.trim()); });
$('#fileBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) startUpload(f); e.target.value = ''; };
$('#newBtn').onclick = () => showEmpty();
$('#orient').onchange = () => { $('#orient').options[0].textContent = 'Detect'; restart(S.region); };
$('#autoBtn').onclick = () => { S.region = null; S.manual = false; setCrop(false); restart(null); };
function setShowMarks(on){
  S.showMarks = on; marksGroup.visible = on; dirty = true;
  $('#marksBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  try { localStorage.setItem('shadowboard.marks', on ? '1' : '0'); } catch (e) {}
}
$('#marksBtn').onclick = () => setShowMarks(!S.showMarks);
try { if (localStorage.getItem('shadowboard.marks') === '0') setShowMarks(false); } catch (e) {}
/* colours of the board and pieces, kept in this browser */
const THEMES = {
  board: [['Green', '#d9cdae', '#56744f'], ['Brown', '#f0d9b5', '#b58863'], ['Blue', '#dee3e6', '#8ca2ad'],
    ['Grey', '#e4e4e0', '#8f938e'], ['Coral', '#f3e7d9', '#c97b63'], ['Purple', '#e9e2f0', '#8a74a8'],
    ['Maple and walnut', '#ecd3a6', '#8b5a34', true], ['Oak', '#e6c99c', '#b07f4c', true],
    ['Rosewood', '#e8c69c', '#6b3424', true], ['Grey wood', '#dedad2', '#7a7369', true]],
  pieces: [['Ivory and ebony', '#ffffff', '#3e3b35'], ['Boxwood and rosewood', '#ffd9a3', '#6e3a24', true],
    ['Maple and walnut', '#ffe6b8', '#5a3820', true], ['Cream and red', '#fff3dc', '#a8352c'],
    ['Cream and blue', '#fff3dc', '#2f4f86'], ['Silver and gold', '#d6dade', '#c9a23e']],
};
const COLOUR_UI = {
  board: { select: '#boardTheme', inputs: ['#boardLight', '#boardDark'], wood: '#boardWood', paint: paintBoard },
  pieces: { select: '#pieceTheme', inputs: ['#pieceWhite', '#pieceBlack'], wood: '#pieceWood', paint: paintPieces },
};
let colourPrefs = {};
try { colourPrefs = JSON.parse(localStorage.getItem('shadowboard.colours')) || {}; } catch (e) {}
function setColours(kind, a, b, wood, save){
  const ui = COLOUR_UI[kind];
  ui.paint(a, b, wood);
  $(ui.inputs[0]).value = a; $(ui.inputs[1]).value = b; $(ui.wood).checked = wood;
  const i = THEMES[kind].findIndex(([, x, y, w = false]) => x === a && y === b && w === wood);
  $(ui.select).value = i >= 0 ? String(i) : 'custom';
  if (save){
    colourPrefs[kind] = [a, b, wood];
    try { localStorage.setItem('shadowboard.colours', JSON.stringify(colourPrefs)); } catch (e) {}
  }
}
for (const [kind, ui] of Object.entries(COLOUR_UI)){
  const sel = $(ui.select);
  THEMES[kind].forEach(([name], i) => sel.add(new Option(name, String(i))));
  sel.add(new Option('Custom', 'custom'));
  sel.onchange = () => { const t = THEMES[kind][+sel.value]; if (t) setColours(kind, t[1], t[2], !!t[3], true); };
  const changed = () => setColours(kind, $(ui.inputs[0]).value, $(ui.inputs[1]).value, $(ui.wood).checked, true);
  for (const el of [...ui.inputs, ui.wood]) $(el).addEventListener('input', changed);
  const saved = colourPrefs[kind], valid = Array.isArray(saved) && /^#[0-9a-f]{6}$/i.test(saved[0]) && /^#[0-9a-f]{6}$/i.test(saved[1]);
  const [, a, b] = THEMES[kind][0];
  setColours(kind, valid ? saved[0] : a, valid ? saved[1] : b, valid && saved[2] === true, false);
}
const tableSel = $('#tableSel'), themeMeta = document.querySelector('meta[name="theme-color"]');
themeMeta.dataset.plain = themeMeta.content;
for (const [key, t] of Object.entries(TABLES)) tableSel.add(new Option(t.name, key));
tableSel.onchange = () => {
  setTable(tableSel.value);
  try { localStorage.setItem('shadowboard.table', tableSel.value); } catch (e) {}
};
try { const k = localStorage.getItem('shadowboard.table'); if (TABLES[k]) tableSel.value = k; } catch (e) {}
setTable(tableSel.value);
$('#copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(S.fen); hint('FEN copied.'); } catch (e) { hint(S.fen); }
};
const menu = $('#menu'), moreBtn = $('#moreBtn'), menuBackdrop = $('#menuBackdrop');
function closeMenu(){ menu.hidden = menuBackdrop.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); }
function openMenu(){
  // as a popover it opens upwards from the card, so it may only be as tall as the room above it
  menu.style.maxHeight = matchMedia('(max-width:700px), (max-height:500px)').matches ? '' : Math.max(240, $('#tools').getBoundingClientRect().top - 16) + 'px';
  menu.hidden = menuBackdrop.hidden = false; moreBtn.setAttribute('aria-expanded', 'true');
}
moreBtn.onclick = e => { e.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); };
$('#menuClose').onclick = closeMenu;
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMenu(); if (S.fixing) endFix(); } });
menu.addEventListener('click', e => { if (e.target.closest('button')) setTimeout(closeMenu, 0); });

/* pinch to zoom the 3D board on touch screens */
const touches = new Map();
let pinch0 = null;
cv.addEventListener('pointerdown', e => { touches.set(e.pointerId, e); if (touches.size === 2){ drag = null; const [a, b] = [...touches.values()]; pinch0 = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: orbit.zoom }; } });
cv.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, e);
  if (pinch0 && touches.size === 2){
    drag = null;
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    orbit.zoom = orbit.zoomTarget = Math.min(1.7, Math.max(0.55, pinch0.z * pinch0.d / Math.max(d, 1)));
    showView(null); dirty = true;
  }
});
const endTouch = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch0 = null; };
cv.addEventListener('pointerup', endTouch); cv.addEventListener('pointercancel', endTouch);

/* the moves of the game on show, for the scoresheets: back to the last game start (or a position
   the reader jumped to), with takebacks taken off. [{n, w, b}] */
const START_PLACEMENT = START_FEN.split(' ')[0];
function gameMoves(){
  let line = [];
  for (let i = 0; i <= S.idx && i < S.events.length; i++){
    const e = S.events[i], place = e.fen.split(' ')[0];
    if (e.san) line.push({ san: e.san, fen: e.fen });
    else if (e.jump || place === START_PLACEMENT) line = [];
    else while (line.length && line[line.length - 1].fen.split(' ')[0] !== place) line.pop();
  }
  const rows = [];
  for (const { san, fen } of line){
    const [, turn, , , , full] = fen.split(' ');
    const n = turn === 'b' ? +full : +full - 1, white = turn === 'b';
    let row = rows[rows.length - 1];
    if (!row || row.n !== n || white || row.b){ row = { n }; rows.push(row); }
    if (white) row.w = san; else { if (!row.w && rows.length === 1) row.w = '\u2026'; row.b = san; }
  }
  return rows;
}
function updateSheets(){ if (sheets.length) writeSheets(gameMoves()); }
// the scoresheets are written by hand: redraw them once the handwriting font is in
Promise.all(['500 40px Caveat', '600 30px "Instrument Sans"'].map(f => document.fonts.load(f))).then(() => { sheetKey = null; updateSheets(); }).catch(() => {});
/* the clock runs for the side to move while the video plays */
setInterval(() => {
  if (!clock.tex) return;
  const t = playerTime();
  if (S.source && clock.lastT != null && t > clock.lastT && t - clock.lastT < 2){
    const turn = S.fen.split(' ')[1];
    clock.time[turn] = Math.max(0, clock.time[turn] - (t - clock.lastT));
  }
  clock.lastT = t;
  drawClock();
}, 250);
try { if (localStorage.getItem('shadowboard.sway') === '1') setSway(true); } catch (e) {}

sync3D(fenToBoard(START_FEN), false);
resize3D();
requestAnimationFrame(loop);
updateButtons();
if (!location.hash.includes('v=')) showSeries();
resume();
window.__sb = { S, playerTime };
</script>
